name: ci

on:
  push:
    branches:
      - main
      - consent-format-ci17-rescue
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository contract
        run: python3 tools/verify_consent_repository.py repository-contract

  line-counts:
    name: line counts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
