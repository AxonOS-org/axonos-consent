# SPDX-License-Identifier: Apache-2.0 OR MIT
# Every change to axonos-consent passes every job below. The aggregate job, CI,
# is the branch-protection target; the proofs, the concurrency models and the
# conformance vectors block a merge exactly as the tests do.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Formatting ───────────────────────────────────────────────────
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── 2. Lint ─────────────────────────────────────────────────────────
  clippy:
    name: Lint (clippy, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --lib -- -D warnings

  # ── 3. Spelling ─────────────────────────────────────────────────────
  typos:
    name: Spelling (typos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@master

  # ── 4. Tests ────────────────────────────────────────────────────────
  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: All features — the boundary under attack, dual control, vectors
        run: cargo test --all-features
      - name: No default features — no dependencies, no_std surface
        run: cargo test --no-default-features

  test-beta:
    name: Test (beta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@beta
      - uses: Swatinem/rust-cache@v2
      - run: cargo +beta test --all-features

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml selects stable; name the MSRV explicitly.
      - run: cargo +1.85 test --all-features

  # ── 5. Proofs: Kani ─────────────────────────────────────────────────
  kani:
    name: Proofs (Kani)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: model-checking/kani-github-action@v1
        with:
          args: --no-default-features

  # ── 6. Concurrency: loom ────────────────────────────────────────────
  loom:
    name: Concurrency (loom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --lib loom
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"

  # ── 7. Conformance vectors ──────────────────────────────────────────
  vectors:
    name: Conformance vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Byte for byte against the generator
        run: cargo run --example gen_vectors --features std -- --check
      - name: Checksums
        run: cd vectors && sha256sum --check --strict SHA256SUMS

  # ── 8. Documentation ────────────────────────────────────────────────
  docs:
    name: Documentation (rustdoc, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --doc --all-features

  # ── 9. Bare metal ───────────────────────────────────────────────────
  bare-metal:
    name: Bare metal (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, thumbv8m.main-none-eabihf]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Without a verifier (bring your own)
        run: cargo build --release --target ${{ matrix.target }} --no-default-features
      - name: With the reference Ed25519 verifier
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features ed25519

  # ── 10. Undefined behaviour ─────────────────────────────────────────
  miri:
    name: Miri (UB detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri test --no-default-features --lib
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  # ── 11. Fuzzing ─────────────────────────────────────────────────────
  fuzz:
    name: Fuzz (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run each target
        run: |
          for target in frame_decode fsm_sequence auth_forgery; do
            cargo +nightly fuzz run "$target" --target x86_64-unknown-linux-gnu -- -max_total_time=60
          done

  # ── 12. Supply chain ────────────────────────────────────────────────
  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  # ── 13. Coverage ────────────────────────────────────────────────────
  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-features --summary-only

  # ── 14. Packaging ───────────────────────────────────────────────────
  package:
    name: Package (publish dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run

  # ── 15. Repository contract ─────────────────────────────────────────
  integrity:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Versions, wire constants, vectors, SPDX, claims, badges, links
        run: python3 tools/check.py
      - name: Licence files
        run: |
          for f in LICENSE LICENSE-APACHE LICENSE-MIT LICENSE-CC-BY-SA vectors/LICENSE; do test -f "$f"; done
          grep -q 'SPDX-License-Identifier: CC-BY-SA-4.0' LICENSE-CC-BY-SA
          grep -q 'SPDX-License-Identifier: CC0-1.0' vectors/LICENSE

  # ── 16. Aggregate gate (branch-protection target) ───────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - fmt
      - clippy
      - typos
      - test
      - test-beta
      - msrv
      - kani
      - loom
      - vectors
      - docs
      - bare-metal
      - miri
      - fuzz
      - deny
      - coverage
      - package
      - integrity
    steps:
      - name: Every required job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "one or more required jobs did not succeed"
            exit 1
          fi
          echo "every required job succeeded"
