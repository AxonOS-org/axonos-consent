name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace --all-features
      - name: test no-default-features
        run: cargo test --workspace --no-default-features

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  no_std:
    name: no_std build on ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [thumbv7em-none-eabihf, thumbv8m.main-none-eabihf]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target ${{ matrix.target }} --no-default-features --release

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -Dwarnings --cfg docsrs
        run: cargo doc --workspace --no-deps --all-features

  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: setup miri
        run: cargo miri setup
      - name: miri test
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo miri test --workspace --all-features

  cargo-deny:
    name: cargo-deny (audit + license)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  license-check:
    name: LICENSE files present and SPDX-tagged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assert all four LICENSE files exist
        run: |
          test -f LICENSE && echo "✓ LICENSE"
          test -f LICENSE-APACHE && echo "✓ LICENSE-APACHE"
          test -f LICENSE-MIT && echo "✓ LICENSE-MIT"
          test -f LICENSE-CC-BY-SA && echo "✓ LICENSE-CC-BY-SA"
      - name: assert SPDX identifiers
        run: |
          grep -q 'SPDX-License-Identifier: Apache-2.0 OR MIT' LICENSE
          grep -q 'SPDX-License-Identifier: CC-BY-SA-4.0' LICENSE-CC-BY-SA
          echo "✓ all SPDX identifiers present"
