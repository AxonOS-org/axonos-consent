name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (ubuntu, stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --all-features --verbose
      - name: cargo test no-default-features
        run: cargo test --no-default-features --verbose

  build_no_std:
    name: build no_std (Cortex-M4F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --target thumbv7em-none-eabihf
        run: cargo build --target thumbv7em-none-eabihf --no-default-features --release

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -- -W clippy::all

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --no-deps --all-features

  license_check:
    name: LICENSE files present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assert all four LICENSE files exist
        run: |
          test -f LICENSE
          test -f LICENSE-APACHE
          test -f LICENSE-MIT
          test -f LICENSE-CC-BY-SA
          test -f vectors/LICENSE
          echo "✓ all 5 LICENSE files present"
      - name: assert SPDX identifiers
        run: |
          grep -q 'SPDX-License-Identifier: Apache-2.0 OR MIT' LICENSE
          grep -q 'SPDX-License-Identifier: CC-BY-SA-4.0' LICENSE-CC-BY-SA
          grep -q 'SPDX-License-Identifier: CC0-1.0' vectors/LICENSE
          echo "✓ all SPDX identifiers present"
