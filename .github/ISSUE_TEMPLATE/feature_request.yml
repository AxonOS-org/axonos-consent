name: Feature request
description: Propose a change or addition
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: layer
    attributes:
      label: Affected AxonOS layer
      options:
        - Consent state machine (Standard Section 15)
        - Trusted path (Standard Section 16)
        - Wire format / ABI
        - Cryptographic surface
        - Conformance vectors
        - Documentation / tooling
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security and privacy impact
      description: Does this touch a capability boundary, the consent FSM, or any data class?
    validations:
      required: true
