name: Security-boundary discussion
description: Discuss a capability or isolation boundary (NOT a vulnerability report)
labels: ["security-boundary"]
body:
  - type: markdown
    attributes:
      value: |
        This template is for **non-exploitable** boundary discussion and hardening ideas.
        If you have found an exploitable vulnerability, do **not** file here —
        email security@axonos.org. See SECURITY.md.
  - type: textarea
    id: boundary
    attributes:
      label: Capability / isolation boundary
      description: Which boundary is in question (e.g., trusted-path origin, withdrawal terminality)?
    validations:
      required: true
  - type: dropdown
    id: data-class
    attributes:
      label: Data class involved
      options:
        - Consent state / transitions
        - Manifest identifier
        - Cryptographic material (no secrets in this issue)
        - None / structural only
    validations:
      required: true
  - type: textarea
    id: threat
    attributes:
      label: Threat model and expected isolation
    validations:
      required: true
  - type: textarea
    id: bypass
    attributes:
      label: Possible bypass (described without sensitive data)
    validations:
      required: false
