[package]
name = "axonos-consent-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
axonos-consent = { path = "..", features = ["ed25519"] }

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fsm_sequence"
path = "fuzz_targets/fsm_sequence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "auth_forgery"
path = "fuzz_targets/auth_forgery.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
