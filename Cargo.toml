[package]
name = "axonos-consent"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
authors = ["Denis Yermakou <info@axonos.org>"]
description = "Protocol-level consent enforcement for AxonOS — kernel-level state machine, formally bounded, #![no_std]."
documentation = "https://docs.rs/axonos-consent"
repository = "https://github.com/AxonOS-org/axonos-consent"
homepage = "https://axonos.org"
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["bci", "consent", "real-time", "no-std", "embedded"]
categories = ["embedded", "no-std", "cryptography", "data-structures"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "SPEC.md",
    "CHANGELOG.md",
    "LICENSE",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "LICENSE-CC-BY-SA",
]

[lib]
name = "axonos_consent"
path = "src/lib.rs"

[features]
default = []
std = []
# Property-based testing requires std
proptest = ["dep:proptest", "std"]

[dependencies]
# Core dependencies (all no_std-compatible)

# Property-based testing dependency (gated)
[dependencies.proptest]
version = "1.4"
optional = true
default-features = false
features = ["alloc"]

[dev-dependencies]
proptest = { version = "1.4", default-features = false, features = ["alloc"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"      # size-optimised for embedded targets
debug = false
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }
