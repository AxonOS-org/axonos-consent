[package]
name = "axonos-consent"
version = "0.9.1"
edition = "2021"
rust-version = "1.85"
authors = ["Denis Yermakou <connect@axonos.org>"]
description = "Consent enforcement for brain–computer interfaces: an authenticated, replay-protected consent state machine with a linearizable publication gate. no_std."
documentation = "https://github.com/AxonOS-org/axonos-consent#readme"
repository = "https://github.com/AxonOS-org/axonos-consent"
homepage = "https://axonos.org"
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["bci", "consent", "ed25519", "no-std", "embedded"]
categories = ["embedded", "no-std", "cryptography"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "SPEC.md",
    "CHANGELOG.md",
    "LICENSE",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "LICENSE-CC-BY-SA",
]

[lib]
name = "axonos_consent"
path = "src/lib.rs"

[features]
default = ["ed25519"]
# Hosted conveniences: std::error::Error for ConsentError.
std = []
# The reference signature verifier: Ed25519 (RFC 8032) with strict verification.
# Without it, the integrator supplies a SignatureVerifier (for example a secure element).
ed25519 = ["dep:ed25519-dalek"]
# Precomputed tables: faster verification, at a cost of tens of KiB of flash.
ed25519-fast = ["ed25519", "ed25519-dalek/fast"]

[dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false, optional = true }

[dev-dependencies]
ed25519-dalek = { version = "3.0.0" }

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(kani)"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
debug = false
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[[example]]
name = "basic_usage"
required-features = ["std", "ed25519"]

[[example]]
name = "dual_control"
required-features = ["std", "ed25519"]

[[example]]
name = "publication_gate"
required-features = ["std"]

[[example]]
name = "gen_vectors"
required-features = ["std", "ed25519"]

[[bench]]
name = "withdrawal_latency"
harness = false
required-features = ["std", "ed25519"]
