[package]
name = "axonos-consent"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
authors = ["Denis Yermakou <connect@axonos.org>"]
description = "AxonOS-native deterministic neural consent runtime for no_std BCI systems."
documentation = "https://docs.rs/axonos-consent"
repository = "https://github.com/AxonOS-org/axonos-consent"
homepage = "https://axonos.org"
license = "Apache-2.0 OR MIT"
readme = "README.md"

keywords = [
    "bci",
    "consent",
    "real-time",
    "no-std",
    "embedded",
]

categories = [
    "embedded",
    "no-std",
    "cryptography",
    "data-structures",
]

include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "SPEC.md",
    "CHANGELOG.md",
    "LICENSE",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "LICENSE-CC-BY-SA",
]

[lib]
name = "axonos_consent"
path = "src/lib.rs"

[features]
default = []
std = []

[dependencies]
# This crate carries no external dependencies at v0.3.0.

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
debug = false
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[[example]]
name = "basic_usage"
required-features = ["std"]

[[bench]]
name = "withdrawal_latency"
harness = false
required-features = ["std"]
