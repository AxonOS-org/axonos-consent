[package]
name = "axonos-consent"
version = "0.7.0"
edition = "2021"
rust-version = "1.75"
authors = ["Denis Yermakou <connect@axonos.org>"]
description = "Protocol-level consent enforcement for AxonOS — kernel-level state machine with optional multi-party (guardian) co-authorisation, formally bounded, no_std."
documentation = "https://docs.rs/axonos-consent"
repository = "https://github.com/AxonOS-org/axonos-consent"
homepage = "https://axonos.org"
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["bci", "consent", "real-time", "no-std", "embedded"]
categories = ["embedded", "no-std", "cryptography", "data-structures"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "SPEC.md",
    "CHANGELOG.md",
    "LICENSE",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "LICENSE-CC-BY-SA",
]

[lib]
name = "axonos_consent"
path = "src/lib.rs"

[features]
default = []
std = []

[dependencies]
# All dependencies are no_std-compatible; the crate carries no external dependencies at v0.4.0.

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
debug = false
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[[example]]
name = "basic_usage"
required-features = ["std"]

[[example]]
name = "dual_control"
required-features = ["std"]

[[bench]]
name = "withdrawal_latency"
harness = false
required-features = ["std"]
